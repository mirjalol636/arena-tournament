services:
  - type: web
    name: arena-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arena-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: arena-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: BOT_API_SECRET
        generateValue: true

      - key: ENVIRONMENT
        value: production

      - key: COOKIE_SECURE
        value: "true"

      - key: CORS_ORIGINS
        value: https://TEMP-NETLIFY.netlify.app

      - key: PUBLIC_URL
        value: https://TEMP-NETLIFY.netlify.app

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: DEMO_PASSWORD
        value: ""

  - type: keyvalue
    name: arena-redis
    plan: free
    ipAllowList: []

databases:
  - name: arena-db
    plan: free
    databaseName: arena
    user: arena
